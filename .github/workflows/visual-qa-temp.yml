name: Temporary visual QA

on:
  push:
    branches: [feature/note-training-interaction-stats-v104-20260905]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture landscape states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            ./gradlew installDebug
            mkdir -p visual-qa
            adb shell am start -n com.a3322505a.guitarlearning/.MainActivity
            sleep 3

            tap_text() {
              local label="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml visual-qa/window.xml >/dev/null
              local point
              point="$(python3 - "$label" <<'PY'
import re
import sys
import xml.etree.ElementTree as ET

label = sys.argv[1]
root = ET.parse("visual-qa/window.xml").getroot()
for node in root.iter("node"):
    if node.attrib.get("text") == label:
        left, top, right, bottom = map(int, re.findall(r"\d+", node.attrib["bounds"]))
        print(f"{(left + right) // 2} {(top + bottom) // 2}")
        break
else:
    raise SystemExit(f"Could not find UI text: {label}")
PY
)"
              adb shell input tap $point
              sleep 2
            }

            tap_text "指板训练"
            tap_text "第一把位｜0–4 品"
            sleep 3
            adb exec-out screencap -p > visual-qa/01-awaiting.png

            adb shell input tap 400 350
            adb shell input tap 250 350
            sleep 2
            adb exec-out screencap -p > visual-qa/02-error.png

            tap_text "返回"
            sleep 2
            adb exec-out screencap -p > visual-qa/03-session-stats.png

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: note-training-visual-qa
          path: visual-qa/*.png
